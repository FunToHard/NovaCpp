name: Release & Multi-Platform Native CI

on:
  push:
    tags:
      - 'v*.*.*-pre*'
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish_marketplace:
        description: 'Publish to Visual Studio Code Marketplace'
        required: true
        type: boolean
        default: false
      pre_release:
        description: 'Publish as Pre-Release version (uncheck for Stable)'
        required: true
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: "node24"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-package:
    name: Build & Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
            rust_target: x86_64-pc-windows-msvc
            binary_name: novacpp_native.dll

          - os: ubuntu-latest
            target: linux-x64
            rust_target: x86_64-unknown-linux-gnu
            binary_name: libnovacpp_native.so

          - os: macos-latest
            target: darwin-arm64
            rust_target: aarch64-apple-darwin
            binary_name: libnovacpp_native.dylib

          - os: macos-15-intel
            target: darwin-x64
            rust_target: x86_64-apple-darwin
            binary_name: libnovacpp_native.dylib

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Release Mode (Pre-Release vs Stable)
        id: release_mode
        shell: bash
        run: |
          IS_PRE="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.pre_release }}" = "true" ]; then
              IS_PRE="true"
            fi
          elif [[ "${{ github.ref }}" == *"-pre"* ]]; then
            IS_PRE="true"
          else
            # VS Code Marketplace SemVer convention: odd minor version = pre-release, even = stable
            VERSION=$(node -p "require('./package.json').version")
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            if [ $((MINOR % 2)) -ne 0 ]; then
              IS_PRE="true"
            fi
          fi
          echo "is_pre_release=$IS_PRE" >> "$GITHUB_OUTPUT"
          echo "Release Channel: $([ "$IS_PRE" = "true" ] && echo "Pre-Release" || echo "Stable Release")"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Node dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run check-types

      - name: Build Rust native addon (${{ matrix.rust_target }})
        working-directory: crates/novacpp-native
        run: cargo build --release --target ${{ matrix.rust_target }}

      - name: Test Rust native addon
        working-directory: crates/novacpp-native
        run: cargo test

      - name: Deploy native binary into extension bundle
        shell: bash
        run: |
          mkdir -p native
          CANDIDATES=(
            "target/${{ matrix.rust_target }}/release/${{ matrix.binary_name }}"
            "crates/novacpp-native/target/${{ matrix.rust_target }}/release/${{ matrix.binary_name }}"
            "target/release/${{ matrix.binary_name }}"
            "crates/novacpp-native/target/release/${{ matrix.binary_name }}"
          )
          FOUND=""
          for p in "${CANDIDATES[@]}"; do
            if [ -f "$p" ]; then
              FOUND="$p"
              break
            fi
          done

          if [ -n "$FOUND" ]; then
            cp "$FOUND" native/novacpp_native.node
            echo "Successfully staged native binary: $FOUND -> native/novacpp_native.node"
            ls -lh native/novacpp_native.node
          else
            echo "Error: Native binary not found. Searched in:"
            printf '  %s\n' "${CANDIDATES[@]}"
            echo "Searching filesystem for compiled native binary:"
            find target crates/novacpp-native/target -name "*novacpp_native*" || true
            exit 1
          fi

      - name: Build extension bundle (esbuild)
        run: npm run build

      - name: Run unit test suite
        run: npm test

      - name: Package platform-specific VSIX
        shell: bash
        run: |
          PRE_FLAG=""
          if [ "${{ steps.release_mode.outputs.is_pre_release }}" = "true" ]; then
            PRE_FLAG="--pre-release"
          fi
          npx @vscode/vsce package --target ${{ matrix.target }} $PRE_FLAG --no-dependencies

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: novacpp-${{ matrix.target }}
          path: '*.vsix'
          retention-days: 14

      - name: Publish to Visual Studio Code Marketplace
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || inputs.publish_marketplace }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT || secrets.VSCODE_MARKETPLACE_TOKEN || secrets.MARKETPLACE_PAT || secrets.VSCE_TOKEN }}
        shell: bash
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT secret is not configured. Skipping marketplace publication."
          else
            VSIX_FILE=$(ls *.vsix | head -n 1)
            echo "Publishing platform package $VSIX_FILE to Visual Studio Code Marketplace..."
            npx @vscode/vsce publish --packagePath "$VSIX_FILE" --pat "$VSCE_PAT" --skip-duplicate
          fi

  github-release:
    name: Create GitHub Release
    needs: build-and-package
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all packaged VSIX artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Consolidate VSIX files
        shell: bash
        run: |
          mkdir -p release-vsix
          find artifacts -type f -name "*.vsix" -exec cp {} release-vsix/ \;
          ls -la release-vsix/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-vsix/*.vsix
          prerelease: ${{ contains(github.ref, '-pre') }}
          generate_release_notes: true
